# Configuração do Supabase para o MindFree. O que não está aqui usa o padrão do Supabase.
project_id = "mindfree"

# A função não exige login: o app manda a chave publicável no cabeçalho "apikey"
# e a própria função confere (ver supabase/functions/organizar/index.ts).
[functions.organizar]
verify_jwt = false

# A limpeza do mural só apaga o que já venceu (7 dias), então não precisa de login. O Cron chama uma vez por dia.
[functions.limpar-mural]
verify_jwt = false

# Os avisos da rede só entregam o que já está na fila do banco, então não precisam de login.
[functions.avisar]
verify_jwt = false

# Publicar no Mural: confere a chave publicável e o login dentro da função (como a organizar).
[functions.postar]
verify_jwt = false

# A cópia de segurança diária só grava o retrato do banco num bucket privado; o Cron chama com a chave de serviço.
[functions.backup]
verify_jwt = false

# O e-mail de boas-vindas: o banco chama com a chave de serviço quando uma conta nasce confirmada.
[functions.boas-vindas]
verify_jwt = false
